.appicon{width:60px;height:60px;border-radius:14px;box-shadow:0 2px 5px #20385728}.appicon svg{width:100%;height:100%;display:block}

function icon(a){let c=art[a[0]]||a[1];return `<button class="appbutton" onclick="openApp('${a[0]}')"><span class="appicon ${a[2]}">${c}</span><span>${a[0]}</span></button>`}function nav(t){return `<div class="nav"><button onclick="home()">‹ 主页</button><strong>${t}</strong><span style="width:43px"></span></div>`}function notify(t){let n=$('#notice');n.textContent=t;n.style.display='block';setTimeout(()=>n.style.display='none',2600)}function screen(html){$('#screen').innerHTML=html;$('#screen').scrollTop=0}function home(){app='home';render()}function openApp(a){app=a;render()}

// Swipe upward from the bottom edge to close any app and return home.
// Uses pointer events for both touchscreens and Windows mouse dragging.
(function installAppHomeGesture(){
 const phone=document.getElementById('phone');
 let origin=null;
 phone.addEventListener('pointerdown',function(e){
  if(app==='lock'||app==='passcode'||app==='home'){origin=null;return}
  const rect=phone.getBoundingClientRect();
  if(e.clientY<rect.bottom-115){origin=null;return}
  origin={id:e.pointerId,x:e.clientX,y:e.clientY};
 },{passive:true});
 phone.addEventListener('pointermove',function(e){
  if(!origin||origin.id!==e.pointerId)return;
  const dy=origin.y-e.clientY,dx=Math.abs(origin.x-e.clientX);
  phone.classList.toggle('swiping-home',dy>20&&dy>dx);
 },{passive:true});
 phone.addEventListener('pointerup',function(e){
  if(!origin||origin.id!==e.pointerId)return;
  const dy=origin.y-e.clientY,dx=Math.abs(origin.x-e.clientX);
  origin=null;phone.classList.remove('swiping-home');
  if(dy>35&&dy>dx*.8&&app!=='lock'&&app!=='passcode'&&app!=='home')home();
 },{passive:true});
 phone.addEventListener('pointercancel',function(){origin=null;phone.classList.remove('swiping-home')});
})();
function unlockToPasscode(){if(app!=='lock')return;app='passcode';pin='';pinError='';render()}
function setupSwipe(){
 const el=$('#lockview');if(!el)return;
 el.addEventListener('pointerdown',e=>{swipeStart={y:e.clientY,x:e.clientX};});
 el.addEventListener('pointerup',e=>{if(!swipeStart)return;let dy=swipeStart.y-e.clientY,dx=Math.abs(swipeStart.x-e.clientX);swipeStart=null;if(dy>30&&dy>dx*.6){unlockToPasscode()}});
 el.addEventListener('pointercancel',()=>swipeStart=null);
 el.addEventListener('wheel',e=>{if(e.deltaY>20){unlockToPasscode()}},{passive:true});
}
function renderPasscode(){const digits=['1','2','3','4','5','6','7','8','9','','0','⌫'];screen(`<div class="lock passcode"><div class="pass-title">输入密码</div><div class="pin-dots">${[0,1,2,3].map(i=>`<i class="${i<pin.length?'filled':''}"></i>`).join('')}</div><div style="height:20px;font-size:13px">${pinError||'请输入 4 位数字密码'}</div><div class="pin-grid">${digits.map(d=>d?`<button onclick="pinPress('${d}')">${d}</button>`:'<span></span>').join('')}</div><div class="pin-actions"><button onclick="app='lock';pin='';pinError='';render()">取消</button><button onclick="pinPress('⌫')">删除</button></div></div>`)}
function pinPress(d){if(d==='⌫'){pin=pin.slice(0,-1);pinError='';render();return}if(!/^\d$/.test(d)||pin.length>=4)return;pin+=d;if(pin.length===4){if(pin==='0531'){pin='';pinError='';home();return}pin='';pinError='密码错误，请重试';}render()}
document.addEventListener('keydown',e=>{if(app==='passcode'){if(/^\d$/.test(e.key))pinPress(e.key);else if(e.key==='Backspace')pinPress('⌫');else if(e.key==='Escape'){app='lock';render()}}else if(app==='lock'&&e.key==='ArrowUp'){app='passcode';render()}});

function render(){const p=$('#phone');p.classList.toggle('wall',app==='home');p.classList.toggle('locked',app==='lock'||app==='passcode');if(app==='lock'){screen(`<div class="lock" id="lockview"><div class="locktop"><div style="font-size:23px;margin-bottom:10px">♙</div><div class="lockdate" id="lockdate"></div><div class="locktime" id="locktime"></div></div><div class="lockbottom"><div class="lock-notification" aria-label="Weverse 通知"><div class="lock-notification-icon">${art['WVS']}</div><div class="lock-notification-content"><div class="lock-notification-heading"><b>Weverse</b><span>现在</span></div><div class="lock-notification-title">TWS</div><div class="lock-notification-message">새로운 게시물이 있어요 💙</div></div></div><div class="swipehint" role="button" tabindex="0" onclick="unlockToPasscode()">⌃<br>向上滑动或轻点解锁</div><div class="lockquick"><span>♜</span><span>◎</span></div></div></div>`);setupSwipe()}else if(app==='passcode'){renderPasscode()}else if(app==='home'){screen(`<div class="home"><div class="widgets"><div class="widget"><small>서울 · 首尔</small><div class="big">☀️</div><b>18°</b> <small>模拟天气</small></div><div class="widget"><small>TWS</small><div class="big" style="font-size:27px;font-weight:800;margin-top:28px">DOHOON</div><small>42 FOREVER 💙</small></div></div><div class="apps">${apps.map(icon).join('')}</div><div style="text-align:center;margin-top:25px;color:#58789c">● ○</div></div><div class="dock">${['电话','信息','KKT','Safari'].map(n=>icon(apps.find(a=>a[0]===n))).join('')}</div>`)}else if(app==='WVS')renderWVS();else if(app==='Instagram')renderIG();else if(app==='X')renderX();else if(app==='KKT')renderKKT();else if(app==='信息')renderMessages();else if(app==='时钟')renderClock();else if(app==='备忘录')renderNotes();else if(app==='电话')renderPhone();else if(app==='相册')renderPhotos();else if(app==='Safari')renderSafari();else if(app==='设置')renderSettings();updateClocks()}
function post(who,text,id){let l=!!likes[id],cs=comments[id]||[];return `<article class="post"><div class="row"><div class="avatar">${esc(who.slice(0,2))}</div><div><b>${esc(who)}</b><div class="muted">TWS · 虚构演示帖子</div></div></div><p>${esc(text)}</p><div class="photo">公开照片待添加<br><small>不会用随机照片冒充本人</small></div><div class="actions"><button onclick="toggleLike('${id}')">${l?'❤️':'♡'} ${l?'已赞':'点赞'}</button><button onclick="addComment('${id}')">♧ 评论 ${cs.length}</button></div>${cs.slice(-3).map(c=>`<p style="font-size:12px"><b>42_fan</b> ${esc(c)}</p>`).join('')}</article>`}function toggleLike(id){likes[id]=!likes[id];save('likes',likes);render()}function addComment(id){let c=prompt('输入模拟评论');if(c?.trim()){(comments[id]??=[]).push(c.trim());save('comments',comments);render()}}

let igStoryIndex=0,igStoryStarted=0,igStoryTimer=null,igStoryPaused=false;
function closeIGStory(){if(igStoryTimer){clearInterval(igStoryTimer);igStoryTimer=null}igStoryPaused=false;render()}
function openIGStory(i=0){
 if(igStoryTimer)clearInterval(igStoryTimer);
 igStoryIndex=Math.max(0,Math.min(igFeed.length-1,i));
 igStoryStarted=Date.now();igStoryPaused=false;
 renderIGStory();
 igStoryTimer=setInterval(()=>{
  if(app!=='Instagram'||!document.getElementById('ig-story-viewer')){clearInterval(igStoryTimer);igStoryTimer=null;return}
  if(igStoryPaused)return;
  const f=Math.min(1,(Date.now()-igStoryStarted)/6000);
  const bar=document.getElementById('ig-story-active-progress');if(bar)bar.style.width=(f*100)+'%';
  if(f>=1)nextIGStory(1);
 },60);
}
function nextIGStory(direction){
 const next=igStoryIndex+direction;
 if(next<0){openIGStory(0);return}
 if(next>=igFeed.length){closeIGStory();return}
 openIGStory(next);
}
function renderIGStory(){
 const p=igFeed[igStoryIndex],photo=igImages[p.id]||igPublicPhotos[igStoryIndex%igPublicPhotos.length];
 const host=document.querySelector('.ig-page');if(!host)return;
 let old=document.getElementById('ig-story-viewer');if(old)old.remove();
 host.insertAdjacentHTML('beforeend',`<div class="ig-story-viewer" id="ig-story-viewer">
  <div class="ig-story-progress">${igFeed.map((_,i)=>`<div><i ${i===igStoryIndex?'id="ig-story-active-progress"':''} style="width:${i<igStoryIndex?'100%':'0%'}"></i></div>`).join('')}</div>
  <div class="ig-story-head"><span class="ig-avatar">TWS:</span><b>tws_pledis</b><span style="opacity:.75;font-size:13px">模拟快拍</span><span style="flex:1"></span><button onclick="closeIGStory()" aria-label="关闭快拍">×</button></div>
  <div class="ig-story-photo">
    <img src="${photo}" alt="TWS 公开照片，模拟快拍" onerror="this.style.display='none';this.parentElement.style.background='#10121a'" />
    <button class="ig-story-tap" style="left:0;width:20%" onclick="nextIGStory(-1)" aria-label="上一张"></button>
    <button class="ig-story-tap" style="right:0;width:80%" onclick="nextIGStory(1)" aria-label="下一张"></button>
  </div>
  <div class="ig-story-foot"><input placeholder="发送消息…" aria-label="模拟回复" onfocus="igStoryPaused=true" onblur="igStoryPaused=false"><button onclick="notify('模拟点赞，不会发送到 Instagram')" aria-label="点赞">♡</button><button onclick="notify('模拟分享')" aria-label="分享">➤</button></div>
 </div>`);
}

function noteSaveActive(){if(activeNote<0||!notes[activeNote])return;const el=document.getElementById('iosnote-editor');if(!el)return;const lines=el.value.split('\n');notes[activeNote].title=lines.shift()||'新备忘录';notes[activeNote].body=lines.join('\n');notes[activeNote].edited=Date.now();save('notes',notes)}
function noteBack(){noteSaveActive();activeNote=-1;notesView='list';renderNotes()}
function noteNew(){notes.unshift({title:'',body:'',edited:Date.now()});save('notes',notes);activeNote=0;notesView='editor';renderNotes();setTimeout(()=>document.getElementById('iosnote-editor')?.focus(),50)}
function noteOpen(i){activeNote=i;notesView='editor';renderNotes()}

function noteInsert(t){let el=document.getElementById('iosnote-editor');if(!el)return;let a=el.selectionStart,b=el.selectionEnd;el.setRangeText(t,a,b,'end');el.focus();noteSaveActive()}
function renderNotes(){
if(notesView==='editor'&&activeNote>=0&&notes[activeNote]){

screen(`<div class="iosnotes" style="background:#fff"><div class="ntop"><button onclick="noteBack()">‹ 备忘录</button><div><button onclick="noteRemove()" aria-label="删除备忘录">♲</button><button onclick="noteSaveActive();notify('已保存到本地')">完成</button></div></div><div class="neditor"><div style="text-align:center;color:#999;font-size:12px;padding-top:20px">${new Date(n.edited||Date.now()).toLocaleDateString('zh-CN',{month:'long',day:'numeric'})} ${new Date(n.edited||Date.now()).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</div><textarea id="iosnote-editor" oninput="noteSaveActive()" placeholder="开始输入…">${esc(noteText(n))}</textarea></div><div class="editorbar"><button onclick="noteInsert('☑ ')">☑</button><button onclick="noteInsert('• ')">☷</button><button onclick="noteInsert('  ')">Aa</button><button onclick="noteInsert('📎 ')">⌁</button><button onclick="noteInsert('▦ ')">▦</button></div></div>`);

}
if(notesView==='folders'){screen(`<div class="iosnotes"><div class="ntop"><button onclick="notesView='list';renderNotes()">‹ 返回</button><button onclick="noteNew()">▣</button></div><div class="ncontent"><h1>文件夹</h1><button class="folder" style="width:100%;border:0;text-align:left" onclick="notesView='list';renderNotes()"><span style="color:#c88b00">▣</span> 备忘录 <span style="margin-left:auto;color:#aaa">${notes.length} ›</span></button></div><div class="nfoot"><span>iCloud · 模拟本地文件夹</span><button onclick="noteNew()">▣</button></div></div>`);return}
const visible=notes.map((n,i)=>({n,i})).filter(x=>noteText(x.n).toLowerCase().includes(notesQuery.toLowerCase())).sort((a,b)=>(b.n.edited||0)-(a.n.edited||0));
screen(`<div class="iosnotes"><div class="ntop"><button onclick="notesView='folders';renderNotes()">‹ 文件夹</button><button onclick="notify('本地模拟备忘录')">•••</button></div><div class="ncontent"><h1>备忘录</h1><div class="nsearch">⌕ <input placeholder="搜索" value="${esc(notesQuery)}" oninput="notesQuery=this.value;renderNotes()" aria-label="搜索备忘录"></div><div class="nlist">${visible.length?visible.map(({n,i})=>`<button class="nitem" onclick="noteOpen(${i})"><strong>${esc(n.title||'新备忘录')}</strong><div class="preview"><small>${n.edited?new Date(n.edited).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}):'今天'}</small>　${esc((n.body||'没有附加文本').replace(/\n/g,' ').slice(0,75))}</div></button>`).join(''):'<div style="padding:24px;text-align:center;color:#999">没有备忘录</div>'}</div></div><div class="nfoot"><span>${visible.length} 条备忘录</span><button onclick="noteNew()" style="font-size:24px" aria-label="新建备忘录">▣</button></div></div>`);

case 'general':content=`<button class="strow" onclick="settingsOpen('about')"><span style="flex:1">关于本机</span><span class="stchev">›</span></button>`+settingsInfo('软件更新','已是模拟版本')+settingsInfo('语言与地区','简体中文')+settingsInfo('日期与时间','自动（电脑时间）');break;
case 'about':content=settingsInfo('名称',"DOHOON's iPhone")+settingsInfo('设备型号','iPhone · 网页模拟')+settingsInfo('系统版本','iOS 风格模拟界面')+settingsInfo('序列号','不提供真实设备信息')+settingsInfo('所有者','김도훈 · 虚构粉丝设定');break;
}
body=`<h1>${titleMap[settingsPage]||'设置'}</h1><div class="stgroup">${content}</div><p class="sthint">此页面为视觉和交互模拟，不会更改电脑或手机的真实系统设置。</p>`;
}
screen(`<div class="iossettings">${settingsPage==='root'?'':`<button class="stback" onclick="settingsBack()">‹ 设置</button>`}<div class="stbody">${body}</div></div>`);
}
function renderPhotos(){screen(`<div class="page">${nav('相册')}<div class="section"><h2>最近项目</h2><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:3px">${['☁️','💙','🎧','🌊','🌷','🌙','✨','📷','🎵'].map(e=>`<button class="photo" style="height:auto;aspect-ratio:1;border:0;font-size:35px" onclick="notify('此处尚未添加真实照片')">${e}</button>`).join('')}</div><p class="caption">待加入 TWS 成员公开照片。</p></div></div>`)}function updateStatusIndicators(){
const v=typeof settingsValues==='object'&&settingsValues?settingsValues:{};
const airplane=!!v.airplane,cell=!!v.cellular&&!airplane,wifi=!!v.wifi;
const a=document.getElementById('statusAirplane'),c=document.getElementById('statusCell'),w=document.getElementById('statusWifi'),b=document.getElementById('statusBattery'),f=document.getElementById('statusBatteryFill'),t=document.getElementById('statusBatteryText');
if(a)a.style.display=airplane?'':'none';
if(c)c.style.display=airplane?'none':'';
if(c)c.style.opacity=cell?'1':'.23';
if(w)w.style.opacity=wifi?'1':'.23';
const level=Math.max(1,Math.min(100,Number(v.batteryLevel??86)));
if(f)f.style.width=`calc((100% - 3px) * ${level / 100})`;
if(b)b.classList.toggle('low',level<=20||!!v.lowpower);
if(b)b.classList.toggle('charging',!!v.charging);
if(t)t.textContent=level+'%';
}
function updateClocks(){updateStatusIndicators();let d=new Date(),hm=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});$('#statusTime').textContent=hm;let l=$('#locktime');if(l)l.textContent=hm;let ld=$('#lockdate');if(ld)ld.textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});let sw=$('#swdisplay');if(sw)sw.textContent=fmt(elapsed());let td=$('#timerDisplay');if(td){let v=timerOn?Math.max(0,timerEnd-Date.now()):timerLeft;if(timerOn&&v===0){timerOn=false;timerLeft=0;notify('倒计时结束')}td.textContent=`${String(Math.floor(v/60000)).padStart(2,'0')}:${String(Math.floor(v/1000)%60).padStart(2,'0')}`}for(let [id,tz] of [['seoul','Asia/Seoul'],['tokyo','Asia/Tokyo'],['ny','America/New_York']]){let e=$('#'+id);if(e)e.textContent=d.toLocaleTimeString('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit'})}[['Asia/Seoul','clock-city-0'],['Asia/Tokyo','clock-city-1'],['America/New_York','clock-city-2'],['Europe/London','clock-city-3']].forEach(([tz,id],i)=>{let el=document.getElementById(id);if(el)el.textContent=d.toLocaleTimeString('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit'});let off=document.getElementById('clock-offset-'+i);if(off){let hour=Number(new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',hourCycle:'h23'}).format(d));let local=d.getHours();let diff=(hour-local+36)%24-12;off.textContent=(diff===0?'今天':diff>0?'今天 · +'+diff+'小时':'今天 · '+diff+'小时')}});document.querySelectorAll('.clock-svg-hour').forEach(el=>el.setAttribute('transform',`rotate(${(d.getHours()%12+d.getMinutes()/60)*30} 32 32)`));document.querySelectorAll('.clock-svg-minute').forEach(el=>el.setAttribute('transform',`rotate(${(d.getMinutes()+d.getSeconds()/60)*6} 32 32)`));document.querySelectorAll('.clock-svg-second').forEach(el=>el.setAttribute('transform',`rotate(${(d.getSeconds()+d.getMilliseconds()/1000)*6} 32 32)`));document.querySelectorAll('.iconclock').forEach(el=>{let h=d.getHours()%12+d.getMinutes()/60,m=d.getMinutes()+d.getSeconds()/60,s=d.getSeconds();el.querySelector('.hour').style.transform=`translateX(-50%) rotate(${h*30}deg)`;el.querySelector('.minute').style.transform=`translateX(-50%) rotate(${m*6}deg)`;el.querySelector('.second').style.transform=`translateX(-50%) rotate(${s*6}deg)`})}setInterval(updateClocks,50);render();
